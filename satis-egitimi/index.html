<style>
  :root {
    --black: #0a0a0a;
    --white: #fff;
    --coral: #E94B3C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--black);
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Perde efekti — index.html'deki .stage ile aynı */
  .stage {
    position: relative;
    background: var(--black);
    overflow: hidden;
    isolation: isolate;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 32px 60px;
    text-align: center;
  }
  .stage::before {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 62%;
    background:
      repeating-linear-gradient(90deg,
        #06010a 0px,
        #1a0610 11px,
        #3d1020 23px,
        #5c1828 32px,
        #3d1020 41px,
        #1a0610 53px,
        #06010a 64px);
    opacity: 1;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.12) 5%, rgba(0,0,0,0.30) 14%, rgba(0,0,0,0.55) 24%, rgba(0,0,0,0.80) 35%, rgba(0,0,0,0.95) 44%, black 55%, black 100%);
    mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.12) 5%, rgba(0,0,0,0.30) 14%, rgba(0,0,0,0.55) 24%, rgba(0,0,0,0.80) 35%, rgba(0,0,0,0.95) 44%, black 55%, black 100%);
    animation: curtain-shimmer 22s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  .stage::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 62%;
    background:
      radial-gradient(ellipse 55% 55% at 75% 40%,
        rgba(255, 110, 110, 0.55) 0%,
        rgba(210, 60, 80, 0.32) 30%,
        transparent 65%),
      radial-gradient(ellipse 38% 42% at 75% 40%,
        rgba(255, 140, 100, 0.32) 0%, transparent 55%),
      radial-gradient(ellipse 28% 32% at 75% 40%,
        rgba(255, 200, 140, 0.20) 0%, transparent 60%);
    filter: blur(3px);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.12) 5%, rgba(0,0,0,0.30) 14%, rgba(0,0,0,0.55) 24%, rgba(0,0,0,0.80) 35%, rgba(0,0,0,0.95) 44%, black 55%, black 100%);
    mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.12) 5%, rgba(0,0,0,0.30) 14%, rgba(0,0,0,0.55) 24%, rgba(0,0,0,0.80) 35%, rgba(0,0,0,0.95) 44%, black 55%, black 100%);
  }
  @keyframes curtain-shimmer {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.92; }
  }
  .stage > * { position: relative; z-index: 2; }

  .placeholder__inner {
    max-width: 720px;
  }
  .placeholder__eyebrow {
    display: inline-block;
    padding: 6px 14px;
    border: 1px solid var(--coral);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--coral);
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .placeholder__title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--white);
    margin: 0 0 28px;
  }
  .placeholder__msg {
    font-size: 20px;
    line-height: 1.55;
    color: rgba(255,255,255,0.75);
    margin: 0 0 48px;
  }
  .placeholder__cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 28px;
    background: var(--white);
    color: var(--black);
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 200ms;
  }
  .placeholder__cta:hover {
    transform: translateY(-2px);
  }
  .placeholder__back {
    position: absolute;
    top: 32px;
    left: 32px;
    color: rgba(255,255,255,0.65);
    font-size: 14px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    z-index: 5;
    transition: color 200ms;
  }
  .placeholder__back:hover { color: var(--coral); }

  .placeholder__logo {
    position: absolute;
    top: 28px;
    right: 32px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
    color: var(--white);
    text-decoration: none;
    z-index: 5;
  }
  .placeholder__logo span { color: var(--coral); }
</style>
</head>
<body>

<main class="stage">
  <a href="/" class="placeholder__back">← Ana sayfa</a>
  <a href="/" class="placeholder__logo">btl works<span>.</span></a>

  <div class="placeholder__inner">
    <span class="placeholder__eyebrow">Hizmet</span>
    <h1 class="placeholder__title">Satış Eğitimi</h1>
    <p class="placeholder__msg">
      Sayfamız şu anda güncelleme aşamasındadır. Detaylı içerik yakında yayında olacak. Ziyaretiniz için teşekkür ederiz.
    </p>
    <a href="/#iletisim" class="placeholder__cta">
      İletişime geç <span>→</span>
    </a>
  </div>
</main>

</body>
</html>

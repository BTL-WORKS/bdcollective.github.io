# =====================================================
# BTL WORKS — Netlify Konfigürasyonu
# =====================================================

[build]
  publish = "."
  command = ""

# Admin sayfası SEO'dan hariç tutulur
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# CSS/JS — her seferinde tazelik kontrolü (ETag ile 304 döner)
# Dosya adında sürüm damgası olmadığı için uzun cache tehlikeli:
# stil değişikliği ziyaretçiye saatlerce ulaşmaz.
[[headers]]
  for = "/sub.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Görseller uzun cache
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/static/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Güvenlik
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect'ler (eski .html URL'leri)
[[redirects]]
  from = "/felsefe.html"
  to = "/felsefe/"
  status = 301

[[redirects]]
  from = "/icerik.html"
  to = "/icerik/"
  status = 301

# Katalog redirect kalıbı — .html olan tüm eski URL'ler folder'a
[[redirects]]
  from = "/:page.html"
  to = "/:page/"
  status = 301
